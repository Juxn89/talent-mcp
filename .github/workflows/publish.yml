name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      # The tag is the single source of truth for the published version.
      #
      # It was not, and that cost four releases. dotnet pack took the version from the csproj, which
      # is independent of the tag, so v1.0.2 through v1.0.5 all packed 1.0.1 (the value
      # Directory.Packages.props was imposing at the time), NuGet answered 409, --skip-duplicate
      # swallowed it, and every one of those runs went green having published nothing. Only 1.0.1
      # ever reached nuget.org.
      #
      # Deriving it here makes that divergence structurally impossible rather than something a
      # release checklist has to remember.
      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not carry a SemVer version (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"
      - name: Restore
        run: dotnet restore
      # -p:Version goes to the BUILD as well as to pack. With --no-build, passing it only to pack
      # produces a .nupkg labelled with the tag version wrapping an assembly stamped with the
      # csproj's — the same class of silent mismatch this step exists to remove.
      - name: Build Release
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - name: Pack Talent.Mcp.Server (dotnet tool)
        run: dotnet pack src/Talent.Mcp.Server.Stdio -c Release --no-build --output ./nupkg -p:Version=${{ steps.version.outputs.version }}
      - name: Pack Talent.Mcp.Toolkit (library)
        run: dotnet pack src/Talent.Mcp.Toolkit -c Release --no-build --output ./nupkg -p:Version=${{ steps.version.outputs.version }}
      - name: Show what will be pushed
        run: ls -l ./nupkg
      - name: Push to NuGet (Trusted Publishing)
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              -k ${{ secrets.NUGET_API_KEY }} \
              -s https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: juxn89
          password: ${{ secrets.GHCR_PAT }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/juxn89/talent-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-nuget, publish-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: tag.includes('preview') || tag.includes('rc')
            });
            core.info(`Created release: ${release.data.html_url}`);
