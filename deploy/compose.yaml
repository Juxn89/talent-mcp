# Talent.Mcp — local stack.
#
# F0 scope: Postgres and Keycloak starting, nothing else. The MCP server service is added in F2
# (it has no project yet) and the observability stack — OTel Collector, Jaeger, Prometheus,
# Grafana — in F4. Placeholders are at the bottom so the growth points are visible.
#
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml down -v     # -v also drops the Postgres volume
#
# Image tags verified against quay.io and Docker Hub on 27 Aug 2026. Pinned to exact patch
# versions on purpose: "latest" makes a green CI run unreproducible three weeks later.
#
# Credentials below are DEV-ONLY defaults so `up -d` works with zero setup. Every one is
# overridable from the environment, and production supplies real secrets that way.

name: talent-mcp

services:
  postgres:
    # A1 later swaps this for pgvector/pgvector:pg18 on the same schema and volume — that is the
    # whole point of A2 owning the domain. Keep the major version aligned when that happens.
    image: postgres:18.6-alpine
    container_name: talent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent}
      POSTGRES_USER: ${POSTGRES_USER:-talent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent}
      # Consumed by ./postgres/init/01-keycloak-database.sh, not by the postgres image itself.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # NOT /var/lib/postgresql/data. The postgres 18+ images store data in a
      # major-version-specific subdirectory and refuse to start if the old path is mounted
      # ("there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)").
      # Mounting the parent is what allows `pg_upgrade --link` later without mount-boundary issues.
      # Verified by hitting it on 27 Aug 2026: see docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
      # Runs only on first initialisation of an empty data directory.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U/-d are required: without them pg_isready checks the root role and reports a false green.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talent} -d ${POSTGRES_DB:-talent}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: talent-keycloak
    # start-dev: HTTP without TLS and a relaxed hostname check, which is correct for local work and
    # for Testcontainers. Production uses `start` with KC_HOSTNAME and TLS — see F3.
    # --import-realm only imports when the realm is absent, so a restart does not clobber changes
    # made through the admin console. To force a re-import: `down -v`, which drops the volume.
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak 26 renamed these; KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD are deprecated.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Backed by the same Postgres instance, separate database. Dev-mode H2 would lose the realm
      # on every recreate, and "why did my client disappear" is a bad first experience.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-talent}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-talent}
      # Exposes /health/* on the management port (9000), which the healthcheck below uses.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      # Mounted as a file, not a directory: the path matches the one the plan and AGENTS.md name.
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl or wget (UBI micro base), so this compiles a throwaway
      # single-file Java program against the bundled JDK. This is the workaround Keycloak's own
      # docs recommend; do not "simplify" it to `curl`, it will not exist.
      test:
        - CMD-SHELL
        - >-
          [ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void
          main(String[] args) throws java.lang.Throwable { java.net.URI uri =
          java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK ==
          ((java.net.HttpURLConnection) uri.toURL().openConnection()).getResponseCode() ? 0 : 1); }
          }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java
          http://localhost:9000/health/ready
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # --- Added in F2 -------------------------------------------------------------------------
  # talent-mcp-server:
  #   build: { context: .., dockerfile: deploy/Dockerfile }
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     keycloak: { condition: service_healthy }

  # --- Added in F4: observability -------------------------------------------------------------
  # Versions verified against each project's own releases on 4 Sep 2026 — see
  # docs/verification/otel-stack-versions.md, which also explains the two surprises: Jaeger v1 is EOL
  # and v2 takes OTLP directly (no jaegerexporter needed), and Loki's OTLP endpoint is `/otlp`, not
  # `/otlp/v1/logs`.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: talent-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC — Talent:Otel:Endpoint points here
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "${OTEL_METRICS_PORT:-8889}:8889" # Prometheus scrape target
    # No healthcheck: the contrib image ships no shell (distroless-style base), so neither
    # CMD-SHELL nor a plain CMD probe is available without adding a tool the image does not have.
    # depends_on below therefore uses service_started, not service_healthy.
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  jaeger:
    # Jaeger v1 (all-in-one, exporter-fronted) reached EOL 31 Dec 2025. v2 is rebuilt on the OTel
    # Collector framework and speaks OTLP natively on 4317/4318 — see the verification record.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: talent-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # Query UI, also what Grafana's Jaeger datasource reads
    # No healthcheck for the same no-shell reason as otel-collector.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: talent-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    container_name: talent-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    # No healthcheck: measured 4 Sep 2026, this image ships neither a shell nor wget/curl (`docker exec
    # ... sh` fails with "executable file not found in $PATH", the same failure mode CMD-SHELL and a
    # plain CMD wget probe both hit). depends_on below uses service_started, not service_healthy.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: talent-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # NOT nested under /etc/grafana/provisioning: that whole tree is a single read-only bind mount
      # above, and Docker cannot create a new mountpoint directory inside a read-only mount — measured
      # 4 Sep 2026 ("read-only file system" at container create). /var/lib/grafana is the grafana-data
      # volume instead, which is writable, so mounting a path under it works.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
    name: talent-mcp-postgres-data
  prometheus-data:
    name: talent-mcp-prometheus-data
  loki-data:
    name: talent-mcp-loki-data
  grafana-data:
    name: talent-mcp-grafana-data
