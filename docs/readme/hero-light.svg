<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">talent-mcp</title>
<desc id="desc">An MCP server in C# that gives AI agents typed, secured tools: permissions per tool, and confirmation before anything destructive.</desc>
<style>
	.flow { stroke-dasharray: 6 7; animation: flow 1.6s linear infinite; }
	.pop { opacity: 0; animation: pop .5s ease-out forwards; }
	.glow { animation: glow 2.4s ease-in-out infinite alternate; }
	@keyframes flow { to { stroke-dashoffset: -26; } }
	@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes glow { from { opacity: .6; } to { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } .pop { animation: none; opacity: 1; } }
</style>
<defs>
	<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<linearGradient id="metric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<radialGradient id="orbBlue"><stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
	<radialGradient id="orbAmber"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.096"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
	<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#2563eb" fill-opacity="0.08"/></pattern>
	<clipPath id="frame"><rect width="1280" height="460" rx="28"/></clipPath>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<g clip-path="url(#frame)">
	<rect width="1280" height="460" fill="#f7faff"/>
	<rect width="1280" height="460" fill="url(#dots)"/>
	<circle cx="180" cy="40" r="340" fill="url(#orbBlue)"/>
	<circle cx="1080" cy="480" r="360" fill="url(#orbAmber)"/>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="28" fill="none" stroke="#dbe4f0"/>

<g transform="translate(72 70)">
	<rect width="290" height="30" rx="15" fill="#ffffff" stroke="#dbe4f0"/>
	<circle cx="18" cy="15" r="4.5" fill="#38bdf8" class="glow"/>
	<text x="31" y="20" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".1em" fill="#475569">OPEN SOURCE · .NET 10 · APACHE 2.0</text>
</g>
<text x="68" y="172" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-.03em" fill="#0f172a">talent<tspan fill="url(#brand)">-mcp</tspan></text>
<text x="72" y="230" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">Gives AI agents typed, secured tools.</text>
<text x="72" y="268" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">A permission per tool. Confirmation before anything destructive.</text>
<text x="72" y="300" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">No model inside: deterministic results at zero cost.</text>
<g transform="translate(72 352)"><rect width="144.79999999999998" height="32" rx="16" fill="#ffffff" stroke="#dbe4f0"/><text x="72.39999999999999" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">MCP 2026-07-28</text></g><g transform="translate(224.79999999999998 352)"><rect width="161.2" height="32" rx="16" fill="#ffffff" stroke="#dbe4f0"/><text x="80.6" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">OAuth 2.1 + PKCE</text></g><g transform="translate(394 352)"><rect width="144.79999999999998" height="32" rx="16" fill="#ffffff" stroke="#dbe4f0"/><text x="72.39999999999999" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Stateless HTTP</text></g><g transform="translate(546.8 352)"><rect width="169.39999999999998" height="32" rx="16" fill="#ffffff" stroke="#dbe4f0"/><text x="84.69999999999999" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">stdio dotnet tool</text></g><g transform="translate(724.1999999999999 352)"><rect width="136.6" height="32" rx="16" fill="#ffffff" stroke="#dbe4f0"/><text x="68.3" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">OpenTelemetry</text></g>

<!-- The agent asks for a destructive tool -->
<g transform="translate(720 70)" filter="url(#soft)">
	<rect width="236" height="176" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
	<rect x="18" y="18" width="26" height="26" rx="8" fill="#ffffff" stroke="#dbe4f0"/>
	<path d="M31 24l1.6 4.2L37 30l-4.4 1.8L31 36l-1.6-4.2L25 30l4.4-1.8Z" fill="#2563eb"/>
	<text x="54" y="36" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">AI agent</text>
	<rect x="18" y="60" width="200" height="36" rx="12" fill="#2563eb"/>
	<text x="32" y="83" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#fff">Reject Clara, she accepted…</text>
	<text x="18" y="124" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="11.5" fill="#475569">tools/call</text>
	<text x="18" y="144" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f172a">reject_candidate</text>
	<rect x="18" y="152" width="150" height="2" rx="1" fill="#ef4444" fill-opacity=".6"/>
</g>

<!-- The call reaches the server -->
<path d="M956 158 C 990 158, 980 120, 1010 120" fill="none" stroke="#2563eb" stroke-width="2.2" class="flow"/>
<circle cx="956" cy="158" r="4.5" fill="#2563eb"/>

<!-- The server answers with a question, not a deletion -->
<g transform="translate(1000 54)" filter="url(#soft)">
	<rect width="236" height="206" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
	<rect x="18" y="18" width="26" height="26" rx="8" fill="#2563eb"/>
	<path d="M25 27h12M25 31h12M25 35h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
	<text x="54" y="36" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">talent-mcp</text>
	<g class="pop" style="animation-delay:.3s">
		<rect x="18" y="58" width="112" height="22" rx="11" fill="#f59e0b" fill-opacity="0.16"/>
		<text x="74" y="73" text-anchor="middle" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#b45309">input_required</text>
		<text font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0f172a">
			<tspan x="18" y="104">Reject this candidate?</tspan>
			<tspan x="18" y="122">This cannot be undone.</tspan>
		</text>
		<rect x="18" y="138" width="96" height="30" rx="9" fill="#2563eb"/>
		<text x="66" y="158" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Confirm</text>
		<rect x="122" y="138" width="96" height="30" rx="9" fill="#ffffff" stroke="#dbe4f0"/>
		<text x="170" y="158" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Decline</text>
		<text x="18" y="190" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#475569">scope: talent.candidates.reject</text>
	</g>
</g>

<!-- Every call is traced. The animated group is nested: its transform: none would otherwise replace the translate. -->
<path d="M1118 260 L 1118 294" fill="none" stroke="#2563eb" stroke-width="2.2" class="flow"/>
<g transform="translate(1000 294)"><g class="pop" style="animation-delay:1s">
	<rect width="236" height="40" rx="20" fill="#ffffff" stroke="#dbe4f0"/>
	<circle cx="22" cy="20" r="12" fill="#2563eb" fill-opacity=".15"/>
	<path d="M14 20h4l2.5-5 3.5 10 2.5-5h3" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
	<text x="42" y="25" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Traced</text>
	<text x="92" y="25" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">· per-tool metrics</text>
</g></g>
</svg>
